<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GIF Index</title>
<style>:root{
  --bg: #0b1220;
  --ink: #e5e7eb;
  --muted: rgba(229,231,235,.72);
  --line: rgba(148,163,184,.20);
  --line-strong: rgba(148,163,184,.35);

  --page-pad: 16px;

  --row-gap: 14px;
  --col-gap: 10px;

  /* Scale columns down to fit the window when needed (caps at 256px). */
  --col: min(256px, calc((min(100vw, 980px) - (2 * var(--page-pad)) - 24px - var(--col-gap)) / 2));

  --radius: 14px;
  --shadow: 0 1px 0 rgba(255,255,255,.03),
            0 18px 50px rgba(0,0,0,.55);
}

*{ box-sizing: border-box; }
html{ scroll-behavior: smooth; }
body{
  margin: 0;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  line-height: 1.32;
  color: var(--ink);
  background:
    radial-gradient(1200px 600px at 10% -10%, rgba(96,165,250,.18), transparent 55%),
    radial-gradient(900px 500px at 90% 0%, rgba(167,139,250,.14), transparent 55%),
    radial-gradient(700px 500px at 50% 110%, rgba(34,211,238,.08), transparent 60%),
    var(--bg);
}

/* Sticky top nav */
header{
  position: sticky;
  top: 0;
  z-index: 10;
  backdrop-filter: blur(12px);
  background: rgba(11,18,32,.78);
  border-bottom: 1px solid var(--line);
}
header .wrap{
  padding: 10px 14px;
  max-width: 980px;
  margin: 0 auto;
  display: flex;
  justify-content: flex-start;
}
nav.toc{
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
nav.toc a{
  text-decoration: none;
  color: var(--ink);
  font-size: 13px;
  padding: 7px 12px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,.06);
  box-shadow: 0 1px 0 rgba(255,255,255,.05);
}
nav.toc a:hover{
  border-color: var(--line-strong);
  background: rgba(255,255,255,.10);
}
nav.toc a:focus-visible{
  outline: 2px solid rgba(96,165,250,.65);
  outline-offset: 2px;
}

main{
  max-width: 980px;
  margin: 0 auto;
  padding: var(--page-pad);
}

/* Sections */
section{
  scroll-margin-top: 72px;
  margin-top: 18px;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.04));
  box-shadow: var(--shadow);
  padding: 12px 12px 14px;
}
section:first-of-type{ margin-top: 12px; }

h2{
  scroll-margin-top: 72px;
  margin: 0 0 10px;
  font-size: 18px;
  font-weight: 750;
  letter-spacing: .02em;
  text-transform: uppercase;
  color: rgba(229,231,235,.92);
}
h2::after{
  content: "";
  display: block;
  height: 1px;
  margin-top: 8px;
  background: linear-gradient(90deg, rgba(96,165,250,.65), rgba(167,139,250,.35), transparent 70%);
}

/* Two-column paired grid that scales down to fit */
.pairgrid{
  display: grid;
  grid-template-columns: var(--col) var(--col);
  column-gap: var(--col-gap);
  row-gap: var(--row-gap);
  justify-content: start;
}

.gif{
  display: block;
  width: var(--col);
  height: var(--col);
  border-radius: 10px;
  border: 1px solid rgba(148,163,184,.22);
  background: #0b1220;
  box-shadow: 0 6px 18px rgba(0,0,0,.35);
}

/* Placeholder fade-in */
.lazygif{ opacity: .9; }
.lazygif.is-loaded{ opacity: 1; }

.jump{ margin-top: 10px; }
.jump a{
  font-size: 12px;
  color: var(--muted);
  text-decoration: none;
}
.jump a:hover{ text-decoration: underline; }

@media (prefers-reduced-motion: reduce){
  html{ scroll-behavior: auto; }
}</style>

<script>
(() => {
  const PLACEHOLDER = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==";
  const imgs = Array.from(document.querySelectorAll('img.lazygif[data-src]'));

  const load = (img) => {
    const src = img.getAttribute('data-src');
    if (!src) return;
    if (img.dataset.state === 'loaded') return;
    img.dataset.state = 'loaded';
    img.src = src;
    img.addEventListener('load', () => img.classList.add('is-loaded'), { once: true });
  };

  // Always start from placeholder to prevent early fetches.
  imgs.forEach(img => {
    img.dataset.state = 'idle';
    if (!img.getAttribute('src')) img.setAttribute('src', PLACEHOLDER);
  });

  if (!('IntersectionObserver' in window)) {
    imgs.forEach(load);
    return;
  }

  // Load when approaching viewport; no unload (avoids layout/anchor weirdness).
  const io = new IntersectionObserver((entries) => {
    for (const e of entries) {
      if (e.isIntersecting) {
        load(e.target);
        io.unobserve(e.target);
      }
    }
  }, { root: null, rootMargin: '800px 0px', threshold: 0.01 });

  imgs.forEach(img => io.observe(img));
})();
</script>
