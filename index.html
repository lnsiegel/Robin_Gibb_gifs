<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GIF Index</title>
<style>:root{
  /* Bold-but-clean palette */
  --bg: #0b1220;
  --panel: rgba(255,255,255,.06);
  --panel-solid: #0f172a;          /* fallback-ish */
  --ink: #e5e7eb;
  --muted: rgba(229,231,235,.72);
  --line: rgba(148,163,184,.20);
  --line-strong: rgba(148,163,184,.35);
  --accent: #60a5fa;              /* soft blue accent */
  --accent-2: #a78bfa;            /* subtle purple for depth */

  --page-pad: 16px;
  --nav-pad-y: 10px;
  --nav-pad-x: 14px;

  --col: 256px;
  --col-gap: 10px;
  --row-gap: 14px;

  --radius: 14px;
  --shadow: 0 1px 0 rgba(255,255,255,.03),
            0 18px 50px rgba(0,0,0,.55);
}

*{ box-sizing: border-box; }
html{ scroll-behavior: smooth; }
body{
  margin: 0;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  line-height: 1.32;
  color: var(--ink);
  background:
    radial-gradient(1200px 600px at 10% -10%, rgba(96,165,250,.18), transparent 55%),
    radial-gradient(900px 500px at 90% 0%, rgba(167,139,250,.14), transparent 55%),
    radial-gradient(700px 500px at 50% 110%, rgba(34,211,238,.08), transparent 60%),
    var(--bg);
  padding-bottom: 54px;
}

/* Sticky top nav: bolder */
header{
  position: sticky;
  top: 0;
  z-index: 10;
  backdrop-filter: blur(12px);
  background: rgba(11,18,32,.78);
  border-bottom: 1px solid var(--line);
}
header .wrap{
  padding: var(--nav-pad-y) var(--nav-pad-x);
  max-width: 980px;
  margin: 0 auto;
  display: flex;
  justify-content: flex-start;
}
nav.toc{
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
nav.toc a{
  text-decoration: none;
  color: var(--ink);
  font-size: 13px;
  padding: 7px 12px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,.06);
  box-shadow: 0 1px 0 rgba(255,255,255,.05);
}
nav.toc a:hover{
  border-color: var(--line-strong);
  background: rgba(255,255,255,.10);
}
nav.toc a:focus-visible{
  outline: 2px solid rgba(96,165,250,.65);
  outline-offset: 2px;
}

/* Main container */
main{
  max-width: 980px;
  margin: 0 auto;
  padding: var(--page-pad);
  overflow-x: auto;
}

/* Sections: bold “glass card” with stronger edge */
section{
  scroll-margin-top: 72px;
  margin-top: 18px;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.04));
  box-shadow: var(--shadow);
  padding: 12px 12px 14px;
}

/* Ensure anchored sections are not hidden under sticky header */
section { scroll-margin-top: 64px; }
section:first-of-type{ margin-top: 12px; }

h2{
  scroll-margin-top: 72px;
  margin: 0 0 10px;
  font-size: 18px;
  font-weight: 750;
  letter-spacing: .02em;
  text-transform: uppercase;
  color: rgba(229,231,235,.92);
}
h2::after{
  content: "";
  display: block;
  height: 1px;
  margin-top: 8px;
  background: linear-gradient(90deg, rgba(96,165,250,.65), rgba(167,139,250,.35), transparent 70%);
}

/* Fixed two-column paired grid */
.pairgrid{
  display: grid;
  grid-template-columns: var(--col) var(--col);
  column-gap: var(--col-gap);
  row-gap: var(--row-gap);
  justify-content: start;
}

/* Version 6 — horizontal scroll appears ONLY when viewport is too narrow for two 256px columns */
.pairwrap{
  width: 100%;
  overflow-x: auto;        /* scrollbar only when needed */
  overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
}

.pairgrid{
  min-width: calc(256px * 2 + var(--col-gap)); /* prevents column collapse */
}

.pairwrap:focus-visible{
  outline: 2px solid rgba(96,165,250,.55);
  outline-offset: 2px;
}


/* GIFs: keep framing subtle so they remain the focus */
.gif{
  display: block;
  width: var(--col);
  height: var(--col);
  border-radius: 10px;
  border: 1px solid rgba(148,163,184,.22);
  background: #0b1220;
  box-shadow: 0 6px 18px rgba(0,0,0,.35);
}

/* Jump link */
.jump{
  margin-top: 10px;
}
.jump a{
  font-size: 12px;
  color: var(--muted);
  text-decoration: none;
}
.jump a:hover{ text-decoration: underline; }
.jump a:focus-visible{
  outline: 2px solid rgba(96,165,250,.55);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce){
  html{ scroll-behavior: auto; }
}

/* Hide native horizontal scrollbars in sections (we provide a sticky global bar) */
.pairwrap{
  overflow-x: auto;     /* still scrollable (touch/trackpad) */
  overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 0;
  scrollbar-width: none;           /* Firefox */
}
.pairwrap::-webkit-scrollbar{      /* WebKit */
  height: 0;
}

/* Sticky bottom scrollbar (appears only when needed) */
.hscrollbar{
  position: sticky;
  bottom: 0;
  z-index: 20;
  background: rgba(11,18,32,.78);
  backdrop-filter: blur(12px);
  border-top: 1px solid rgba(148,163,184,.20);
  padding: 10px 14px;
  display: none; /* toggled by JS */
}
.hscrollbar .track{
  max-width: 980px;
  margin: 0 auto;
  overflow-x: auto;
  overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
  border-radius: 999px;
  border: 1px solid rgba(148,163,184,.20);
  background: rgba(255,255,255,.06);
}
.hscrollbar .inner{
  height: 12px; /* gives us a small scrollbar */
}
/* Slightly nicer scrollbar where supported */
.hscrollbar .track::-webkit-scrollbar{
  height: 10px;
}
.hscrollbar .track::-webkit-scrollbar-thumb{
  background: rgba(229,231,235,.35);
  border-radius: 999px;
}
.hscrollbar .track::-webkit-scrollbar-track{
  background: rgba(255,255,255,.04);
  border-radius: 999px;
}
</style>

</main><div class="hscrollbar" id="hscrollbar" aria-label="Horizontal scroll">
  <div class="track" id="hscrollTrack">
    <div class="inner" id="hscrollInner"></div>
  </div>
</div>

<script>
(() => {
  const COL = 256;
  const GAP = 10; // keep in sync with --col-gap / CSS
  const contentWidth = (COL * 2) + GAP;

  const bar = document.getElementById('hscrollbar');
  const track = document.getElementById('hscrollTrack');
  const inner = document.getElementById('hscrollInner');
  const wraps = () => Array.from(document.querySelectorAll('.pairwrap'));

  // Set inner width so the track's scrollbar represents the content width
  function layout() {
    inner.style.width = contentWidth + 'px';
    // Show bar only if viewport can't fit both columns + padding
    const needs = window.innerWidth < (contentWidth + 60); // small allowance for page padding
    bar.style.display = needs ? 'block' : 'none';
    // When bar hidden, reset scroll positions
    if (!needs) {
      track.scrollLeft = 0;
      wraps().forEach(w => { w.scrollLeft = 0; });
    }
  }

  let syncing = false;

  // When user scrolls the sticky bar, scroll all section wrappers
  track.addEventListener('scroll', () => {
    if (syncing) return;
    syncing = true;
    const x = track.scrollLeft;
    wraps().forEach(w => { w.scrollLeft = x; });
    syncing = false;
  }, { passive: true });

  // If user scrolls any section horizontally (touchpad/touch), sync the bar
  document.addEventListener('scroll', () => {}, { passive: true });
  document.addEventListener('wheel', () => {}, { passive: true });

  function attachWrapListeners() {
    wraps().forEach(w => {
      if (w.__hscrollBound) return;
      w.__hscrollBound = true;
      w.addEventListener('scroll', () => {
        if (syncing) return;
        if (bar.style.display !== 'block') return;
        syncing = true;
        track.scrollLeft = w.scrollLeft;
        // keep all wraps in lockstep
        const x = w.scrollLeft;
        wraps().forEach(other => { if (other !== w) other.scrollLeft = x; });
        syncing = false;
      }, { passive: true });
    });
  }

  const observer = new MutationObserver(() => attachWrapListeners());
  observer.observe(document.documentElement, { childList: true, subtree: true });

  attachWrapListeners();
  window.addEventListener('resize', layout, { passive: true });
  layout();
})();
</script>
